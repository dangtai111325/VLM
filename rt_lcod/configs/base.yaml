seed: 1337
run_name: rt_lcod

device: cuda
amp: true

model:
  visual_dim: 576
  text_dim: 384
  hidden_dim: 192
  region_encoder: mobilenet_v3_small
  dropout: 0.10
  top_k: 32
  relation_feature_dim: 11
  detector_name: yoloe-26m.pt
  text_model_name: sentence-transformers/all-MiniLM-L6-v2

training:
  epochs: 30
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  num_workers: 2
  save_every_epochs: 1
  early_stopping_patience: 8
  kd_temperature: 2.0

loss:
  target: 1.0
  attribute: 0.35
  relation: 0.35
  no_target: 0.50
  distillation: 0.50

validation:
  primary_metric: composite
  composite:
    grounding_acc_iou50: 0.50
    no_target_accuracy: 0.25
    attribute_accuracy: 0.15
    relation_accuracy: 0.10

runtime:
  confidence: 0.25
  top_k: 32
  input_size: 640
  prompt_cache: true
  tracking:
    enabled: true
    iou_gate: 0.30
    max_missed: 5
    score_decay: 0.95
