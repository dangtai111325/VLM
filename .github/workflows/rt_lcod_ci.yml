name: RT-LCOD CI

on:
  push:
    paths:
      - "rt_lcod/**"
      - "plan.md"
      - ".github/workflows/rt_lcod_ci.yml"
  pull_request:
    paths:
      - "rt_lcod/**"
      - "plan.md"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Install project dev dependencies
        working-directory: rt_lcod
        run: python -m pip install -e .[dev]
      - name: Compile package
        working-directory: rt_lcod
        run: python -m compileall -q src scripts tests
      - name: Run synthetic smoke test
        working-directory: rt_lcod
        run: python scripts/smoke_test.py
      - name: Run unit tests
        working-directory: rt_lcod
        run: pytest -q
