name: RT-LCOD CI

on:
  push:
    paths:
      - "rt_lcod/**"
      - "plan.md"
      - ".github/workflows/rt_lcod_ci.yml"
  pull_request:
    paths:
      - "rt_lcod/**"
      - "plan.md"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Install project dev dependencies
        working-directory: rt_lcod
        run: python -m pip install -e .[dev]
      - name: Compile package
        working-directory: rt_lcod
        run: python -m compileall -q src scripts tests
      - name: Validate Run All notebook JSON and code syntax
        working-directory: rt_lcod
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          path = Path("notebooks/rt_lcod_end_to_end.ipynb")
          notebook = nbformat.read(path, as_version=4)
          nbformat.validate(notebook)
          code_cells = [cell for cell in notebook.cells if cell.cell_type == "code"]
          for index, cell in enumerate(code_cells):
              compile(cell.source, f"{path}:code-cell-{index}", "exec")
          print(f"Notebook validation PASS: {len(notebook.cells)} cells, {len(code_cells)} code cells")
          PY
      - name: Run synthetic smoke test
        working-directory: rt_lcod
        run: python scripts/smoke_test.py
      - name: Run unit tests
        working-directory: rt_lcod
        run: pytest -q
